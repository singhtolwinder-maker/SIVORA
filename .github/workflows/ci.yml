name: CI

# Vercel deploys on push to main. This workflow runs the same gates first so a
# failing test or build is visible on the commit that caused it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Pin the in-memory MongoDB binary: 8.0 has current Ubuntu builds, so the
      # suite runs against the same server version locally and on the runner.
      MONGOMS_VERSION: 8.0.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run API test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Publish failure details
        # The job log needs repository access to read. Check annotations are
        # public, so the reason for a failure stays visible on the pull request
        # and to anyone triaging from outside the repository.
        if: failure()
        shell: bash
        run: |
          if [ ! -f test-output.log ]; then
            echo "::error::Test step failed before producing output."
            exit 1
          fi
          tail -n 40 test-output.log | tr -d '\r' | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          exit 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
