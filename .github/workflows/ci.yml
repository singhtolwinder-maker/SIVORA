name: CI

# Vercel deploys on push to main. This workflow runs the same gates first so a
# failing test or build is visible on the commit that caused it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Ubuntu 24.04 runners no longer ship libcrypto.so.1.1, which the
      # mongodb-memory-server default binary needs. 8.0 has native Ubuntu
      # builds, so the in-memory server starts on the runner as it does locally.
      MONGOMS_VERSION: 8.0.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run API test suite
        run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
